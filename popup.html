<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Translate Studio 11</title>
  <style>
    :root {
      --bg0: #0a0f1a;
      --bg1: #0d1525;
      --bg2: #121d32;
      --card: rgba(255, 255, 255, 0.06);
      --card-strong: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f0f8ff;
      --muted: #a0c0e0;
      --accent: #64c8ff;
      --accent2: #96dcff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 420px;
      color: var(--text);
      font: 12px/1.5 "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(ellipse 140% 80% at 5% -15%, rgba(100, 200, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 100% 100% at 95% 105%, rgba(80, 180, 255, 0.12), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(100, 180, 240, 0.05), transparent 60%),
        linear-gradient(170deg, var(--bg0), var(--bg1) 50%, var(--bg2));
    }

    .wrap { padding: 16px; }

    .glass {
      background:
        linear-gradient(165deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(200, 230, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.08) 100%
        );
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow:
        0 4px 24px rgba(0, 50, 100, 0.15),
        0 1px 2px rgba(0, 0, 0, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.12) 0%,
        transparent 100%
      );
      pointer-events: none;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background:
        linear-gradient(120deg, rgba(100, 200, 255, 0.12), rgba(80, 180, 255, 0.06)),
        linear-gradient(165deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 4px 12px rgba(0, 50, 100, 0.2);
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .3px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub { font-size: 11px; color: var(--muted); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat {
      padding: 12px;
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .stat .v {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .3px;
      background: linear-gradient(135deg, var(--text), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat .k { font-size: 11px; color: var(--muted); }

    .section { margin-bottom: 12px; }
    .section h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(100, 200, 255, 0.3);
    }
    .panel { padding: 12px; position: relative; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, .2);
    }
    .row:last-child { border-bottom: 0; }

    .label { font-size: 12px; font-weight: 600; }
    .hint { font-size: 10px; color: var(--muted); }

    input, select, textarea, button {
      font: inherit;
      color: var(--text);
      background: rgba(15, 25, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 10px;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    select {
      background: rgba(15, 25, 40, 0.95);
      cursor: pointer;
    }
    select option {
      background: #0d1525;
      color: #f0f8ff;
      padding: 8px;
    }
    select option:hover,
    select option:checked {
      background: #1a2942;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(100, 200, 255, 0.15), 0 0 16px rgba(100, 200, 255, 0.2);
    }
    textarea { width: 100%; min-height: 54px; resize: vertical; }

    .btn {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(100, 200, 255, 0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #062132;
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(100, 200, 255, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 20px rgba(100, 200, 255, 0.4);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .btn-danger {
      border-color: rgba(248, 113, 113, 0.4);
      color: #fecaca;
      background: rgba(220, 38, 38, 0.15);
    }

    .toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .toggle input { display: none; }
    .knob {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .knob::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 2px;
      top: 2px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e0f0ff, #ffffff);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .toggle input:checked + .knob {
      background: linear-gradient(135deg, rgba(100, 200, 255, 0.3), rgba(150, 220, 255, 0.2));
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow: 0 0 16px rgba(100, 200, 255, 0.3);
    }
    .toggle input:checked + .knob::before {
      transform: translateX(18px);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 2px 12px rgba(100, 200, 255, 0.5);
    }

    .api-list { display: grid; gap: 8px; }
    .api-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .api-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .api-item.active {
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow:
        inset 0 0 0 1px rgba(100, 200, 255, 0.2),
        0 0 20px rgba(100, 200, 255, 0.15);
      background: rgba(100, 200, 255, 0.08);
    }
    .api-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #64748b;
      flex-shrink: 0;
    }
    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    }
    .dot.down { background: var(--err); box-shadow: 0 0 8px rgba(248, 113, 113, 0.5); }
    .name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag {
      font-size: 9px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--muted);
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .provider {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .provider:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .provider:last-child { margin-bottom: 0; }
    .provider-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .provider-name { font-size: 13px; font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glass header">
      <img src="icons/icon48.png" alt="icon" />
      <div>
        <div class="title">X Translate · Studio 11</div>
        <div class="sub">液态玻璃 UI · 扩展引擎矩阵 · 智能路由</div>
      </div>
    </div>

    <div class="grid2">
      <div class="stat glass"><div class="v" id="translatedCount">0</div><div class="k">已翻译</div></div>
      <div class="stat glass"><div class="v" id="cachedCount">0</div><div class="k">缓存条数</div></div>
    </div>

    <div class="section">
      <h3>运行控制</h3>
      <div class="glass panel">
        <div class="row">
          <div><div class="label">翻译开关</div><div class="hint" id="statusText">运行中</div></div>
          <label class="toggle"><input id="enableToggle" type="checkbox" checked /><span class="knob"></span></label>
        </div>
        <div class="row">
          <div><div class="label">仅托管 API 模式</div><div class="hint">开启后不回退免费 API</div></div>
          <label class="toggle"><input id="managedOnlyToggle" type="checkbox" /><span class="knob"></span></label>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>官方托管 API（填 Key 即可）</h3>
      <div class="glass panel" id="managedProviderList"></div>
    </div>

    <div class="section">
      <h3>API 引擎池</h3>
      <div class="glass panel">
        <div class="row">
          <div><div class="label">当前可用引擎</div><div class="hint" id="discoveryHint">可点击切换，支持自动探测</div></div>
          <div style="display:flex;gap:6px;">
            <button id="discoverFreeBtn" class="btn btn-ghost">自动搜索免费 API</button>
            <button id="optimizeRouteBtn" class="btn btn-ghost">自动优化路由</button>
            <button id="refreshApis" class="btn btn-ghost">刷新健康度</button>
          </div>
        </div>
        <div id="apiList" class="api-list"></div>
      </div>
    </div>

    <div class="section">
      <h3>自定义 API（保留）</h3>
      <div class="glass panel">
        <div style="display:grid;grid-template-columns:1fr 120px;gap:6px;margin-bottom:6px;">
          <input id="customName" placeholder="名称" />
          <select id="customMethod"><option>POST</option><option>GET</option><option>PUT</option><option>PATCH</option></select>
        </div>
        <input id="customUrl" style="width:100%;margin-bottom:6px;" placeholder="https://api.xxx.com/translate" />
        <textarea id="customHeaders" placeholder='请求头 JSON，例如 {"Authorization":"Bearer sk-xxx"}'></textarea>
        <textarea id="customBody" placeholder='请求体模板，变量: {{text}} {{targetLang}} {{sourceLang}}'></textarea>
        <input id="customResponsePath" style="width:100%;margin:6px 0;" value="translatedText" placeholder="返回字段路径" />
        <button id="saveCustomApi" class="btn btn-primary" style="width:100%;">保存并切换到自定义 API</button>
      </div>
    </div>

    <div class="section">
      <h3>翻译设置</h3>
      <div class="glass panel">
        <div class="row">
          <div><div class="label">目标语言</div><div class="hint">翻译输出语言</div></div>
          <select id="targetLang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ar">العربية</option>
          </select>
        </div>
        <div class="row">
          <div><div class="label">跳过母语</div><div class="hint">目标语已存在时不翻译</div></div>
          <label class="toggle"><input id="skipNative" type="checkbox" checked /><span class="knob"></span></label>
        </div>
        <div class="row">
          <button id="clearCache" class="btn btn-danger">清空缓存</button>
          <div class="hint">v11.0.0</div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
