<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Translate</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --line: #2a2f3a;
      --text: #e7ecf2;
      --muted: #95a0af;
      --accent: #4da3ff;
      --danger: #ef6b6b;
      --ok: #49c27d;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    .wrap { padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
    }
    .head { display: flex; align-items: center; gap: 10px; }
    .head img { width: 28px; height: 28px; border-radius: 6px; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11px; color: var(--muted); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #222734;
    }
    .row:last-child { border-bottom: 0; }
    .label { font-weight: 500; }
    .hint { font-size: 11px; color: var(--muted); }

    input, select, textarea, button {
      font: inherit;
      color: var(--text);
      background: #11141b;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      padding: 7px 9px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #3f78c4; }
    textarea { width: 100%; min-height: 50px; resize: vertical; }
    button { cursor: pointer; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #081521;
      font-weight: 600;
    }
    .btn-danger {
      background: #2a1212;
      border-color: #5b2525;
      color: #ffc7c7;
    }
    .btn-ghost { background: #121722; color: #c7d0dd; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: #121722; border: 1px solid #232a36; border-radius: 8px; padding: 8px; }
    .stat .v { font-size: 18px; font-weight: 700; }
    .stat .k { font-size: 11px; color: var(--muted); }

    .toggle { position: relative; width: 42px; height: 24px; }
    .toggle input { display: none; }
    .knob {
      position: absolute; inset: 0; border-radius: 999px;
      background: #262c37; border: 1px solid #363d4a;
    }
    .knob::before {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%; background: #dbe5f2;
      transition: transform .2s ease;
    }
    .toggle input:checked + .knob { background: #184374; border-color: #3b76b8; }
    .toggle input:checked + .knob::before { transform: translateX(18px); background: #7ec0ff; }

    .api-list { display: grid; gap: 6px; }
    .api-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border: 1px solid #2b3040; border-radius: 8px; padding: 8px; background: #121722;
      cursor: pointer;
    }
    .api-item.active { border-color: #3f78c4; }
    .api-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #64748b; }
    .dot.ok { background: var(--ok); }
    .dot.down { background: var(--danger); }
    .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { font-size: 10px; color: var(--muted); }

    .provider { border: 1px solid #2b3040; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #121722; }
    .provider:last-child { margin-bottom: 0; }
    .provider-title { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .provider-name { font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card head">
      <img src="icons/icon48.png" alt="icon" />
      <div>
        <div class="title">X Translate</div>
        <div class="sub">简约模式 · 不扰眼</div>
      </div>
    </div>

    <div class="stats card">
      <div class="stat"><div class="v" id="translatedCount">0</div><div class="k">已翻译</div></div>
      <div class="stat"><div class="v" id="cachedCount">0</div><div class="k">缓存</div></div>
    </div>

    <div class="card">
      <div class="row">
        <div><div class="label">翻译开关</div><div class="hint" id="statusText">运行中</div></div>
        <label class="toggle"><input id="enableToggle" type="checkbox" checked /><span class="knob"></span></label>
      </div>
      <div class="row">
        <div><div class="label">仅托管 API 模式</div><div class="hint">不开启免费回退</div></div>
        <label class="toggle"><input id="managedOnlyToggle" type="checkbox" /><span class="knob"></span></label>
      </div>
      <div class="row">
        <div class="label">目标语言</div>
        <select id="targetLang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
        </select>
      </div>
      <div class="row">
        <div><div class="label">跳过母语</div><div class="hint">已是目标语则不翻译</div></div>
        <label class="toggle"><input id="skipNative" type="checkbox" checked /><span class="knob"></span></label>
      </div>
      <div class="row">
        <button id="clearCache" class="btn-danger">清空缓存</button>
        <div class="hint">v1.0.0</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div><div class="label">API 引擎池</div><div class="hint" id="discoveryHint">可点击切换</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
          <button id="discoverFreeBtn" class="btn-ghost">搜索免费 API</button>
          <button id="optimizeRouteBtn" class="btn-ghost">优化路由</button>
          <button id="refreshApis" class="btn-ghost">刷新</button>
        </div>
      </div>
      <div id="apiList" class="api-list"></div>
    </div>

    <div class="card">
      <div class="label" style="margin-bottom:8px;">官方托管 API</div>
      <div id="managedProviderList"></div>
    </div>

    <div class="card">
      <div class="label" style="margin-bottom:8px;">自定义 API</div>
      <div style="display:grid;grid-template-columns:1fr 110px;gap:6px;margin-bottom:6px;">
        <input id="customName" placeholder="名称" />
        <select id="customMethod"><option>POST</option><option>GET</option><option>PUT</option><option>PATCH</option></select>
      </div>
      <input id="customUrl" style="width:100%;margin-bottom:6px;" placeholder="https://api.xxx.com/translate" />
      <textarea id="customHeaders" placeholder='请求头 JSON，例如 {"Authorization":"Bearer sk-xxx"}'></textarea>
      <textarea id="customBody" placeholder='请求体模板：{{text}} {{targetLang}} {{sourceLang}}'></textarea>
      <input id="customResponsePath" style="width:100%;margin:6px 0;" value="translatedText" placeholder="返回字段路径" />
      <button id="saveCustomApi" class="btn-primary" style="width:100%;">保存并切换</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
